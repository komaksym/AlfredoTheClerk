<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alfredo human review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/review.css') }}">
</head>
<body>
  <div class="app-frame">
    <aside class="app-sidebar">
      <a class="brand-lockup" href="/" aria-label="Alfredo home">
        <svg class="brand-mascot" viewBox="0 0 64 64" aria-hidden="true">
          <path class="mascot-hair" d="M18 27c0-11 6-18 14-18 9 0 15 7 15 18v3H18z"/>
          <path class="mascot-face" d="M20 26c0-8 5-14 12-14s12 6 12 14v8c0 8-5 14-12 14S20 42 20 34z"/>
          <path class="mascot-ear" d="M17 29c-3 0-4 3-3 6 1 3 3 5 6 4v-9c-1-1-2-1-3-1zm30 0c3 0 4 3 3 6-1 3-3 5-6 4v-9c1-1 2-1 3-1z"/>
          <circle class="mascot-eye" cx="27" cy="29" r="1.4"/>
          <circle class="mascot-eye" cx="37" cy="29" r="1.4"/>
          <path class="mascot-brow" d="M23.5 25.5c2-1.4 4.3-1.5 6.2-.3m4.6 0c1.9-1.2 4.2-1.1 6.2.3"/>
          <path class="mascot-moustache" d="M32 35c-2.5-3-6-3.8-9-1.2 1 4 5.5 5.6 9 2.3 3.5 3.3 8 1.7 9-2.3-3-2.6-6.5-1.8-9 1.2z"/>
          <path class="mascot-neck" d="M27 45h10v7H27z"/>
          <path class="mascot-shirt" d="M21 55c2-5 6-7 11-7s9 2 11 7v5H21z"/>
          <path class="mascot-bow" d="M32 52l-7-4-3 4 3 4 7-3 7 3 3-4-3-4z"/>
        </svg>
        <span class="brand-wordmark">Alfredo</span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-item is-active" href="/review" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h8.5L18 7.25v13H6z"/><path d="M14.5 3.75v3.5H18M9 11h6M9 15h6"/></svg>
          <span>Review</span>
        </a>
        <span class="nav-item nav-item-disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 7.5h6l1.75 2h8.75v9.75H3.75z"/></svg>
          <span>Invoices</span>
        </span>
        <span class="nav-item nav-item-disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7-.7-2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7z"/></svg>
          <span>Settings</span>
        </span>
      </nav>

      <div class="sidebar-footer">
        <span class="nav-item nav-item-disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.75 9.25a2.5 2.5 0 1 1 3.1 2.43c-.62.18-.85.58-.85 1.32v.5M12 17.25h.01"/></svg>
          <span>Help</span>
        </span>
      </div>
    </aside>

    <main class="app-main">
      <div class="page-shell">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', path='/review.js') }}" defer></script>
</body>
</html>
