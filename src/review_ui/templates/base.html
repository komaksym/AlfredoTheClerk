<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alfredo human review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/review.css') }}">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Alfredo the Clerk</a>
    <span class="app-kicker">Invoice repair review</span>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/review.js') }}" defer></script>
</body>
</html>
