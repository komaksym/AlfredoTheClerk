<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentic repair benchmark architecture</title>
  <desc id="desc">Two-lane diagram separating the 30-case held-out headline benchmark from the 200-case generated sanity corpus.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#475569}
      .lane{font-size:17px;font-weight:700}.h{font-size:18px;font-weight:700}.p{font-size:14px;fill:#334155}
      .tag{font-size:13px;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text class="title" x="52" y="58">Agentic repair benchmark</text>
  <text class="sub" x="52" y="88">Headline evaluation and deterministic regression coverage are intentionally separated.</text>

  <rect x="42" y="125" width="1316" height="365" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="42" y="125" width="210" height="365" rx="24" fill="#eff6ff"/>
  <text class="lane" x="72" y="172">Headline lane</text>
  <text class="tag" x="72" y="199" fill="#1d4ed8">PUBLISHABLE METRICS</text>
  <text class="p" x="72" y="234">Only the separately</text>
  <text class="p" x="72" y="255">authored hard split may</text>
  <text class="p" x="72" y="276">enter this path.</text>

  <rect x="285" y="190" width="190" height="112" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="h" x="310" y="225">30 held-out cases</text>
  <text class="p" x="310" y="251">Neutral metadata</text>
  <text class="p" x="310" y="274">Varied evidence and ranks</text>

  <rect x="525" y="190" width="190" height="112" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text class="h" x="550" y="225">Production graph</text>
  <text class="p" x="550" y="251">Real LangGraph runner</text>
  <text class="p" x="550" y="274">Real repair tool contract</text>

  <rect x="765" y="154" width="190" height="72" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="h" x="790" y="184">Tool selection</text>
  <text class="p" x="790" y="207">Record candidate indexes</text>
  <rect x="765" y="244" width="190" height="72" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text class="h" x="790" y="274">Safe abstention</text>
  <text class="p" x="790" y="297">Record no-action decision</text>
  <rect x="765" y="334" width="190" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="790" y="364">Attempt error</text>
  <text class="p" x="790" y="387">Preserve diagnostic failure</text>

  <rect x="1005" y="190" width="155" height="112" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="h" x="1030" y="225">Score</text>
  <text class="p" x="1030" y="251">Require every</text>
  <text class="p" x="1030" y="272">case × repeat</text>

  <rect x="1205" y="190" width="120" height="112" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="h" x="1227" y="225">Report</text>
  <text class="p" x="1227" y="250">JSON + MD</text>
  <text class="p" x="1227" y="272">≤ 5% errors</text>

  <path class="line" d="M475 246H513"/><path class="line" d="M715 246H753"/>
  <path class="line" d="M955 190C978 190 978 230 993 230"/>
  <path class="line" d="M955 280H993"/><path class="line" d="M955 370C978 370 978 270 993 270"/>
  <path class="line" d="M1160 246H1193"/>

  <rect x="42" y="525" width="1316" height="145" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="42" y="525" width="210" height="145" rx="24" fill="#f1f5f9"/>
  <text class="lane" x="72" y="572">Sanity lane</text>
  <text class="tag" x="72" y="599" fill="#475569">REGRESSION ONLY</text>
  <rect x="285" y="546" width="225" height="100" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="310" y="580">200 generated cases</text>
  <text class="p" x="310" y="606">Reproducible tool-contract</text>
  <text class="p" x="310" y="628">and scoring coverage</text>
  <rect x="650" y="546" width="250" height="100" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="675" y="580">Deterministic checks</text>
  <text class="p" x="675" y="606">Byte-for-byte regeneration</text>
  <text class="p" x="675" y="628">Never used for headline claims</text>
  <path class="dash" d="M510 596H638"/>
  <text class="sub" x="1000" y="588">Generated evidence and truth share rules,</text>
  <text class="sub" x="1000" y="613">so this lane cannot publish performance.</text>
</svg>
