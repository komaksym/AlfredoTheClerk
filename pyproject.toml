[project]
name = "alfredotheclerk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "cryptography",
    "dotenv>=0.9.9",
    "fastapi",
    "httpx",
    "jinja2",
    "langchain>=1.3.2",
    "langchain-deepseek>=1.0.1",
    "pdfplumber>=0.11.9",
    "python-multipart",
    "rapidfuzz>=3.0",
    "uvicorn",
    "weasyprint>=68.1",
    "xsdata[cli]>=26.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "ksef_live: opt-in test that submits a synthetic invoice to KSeF TEST",
]

[tool.ruff]
line-length = 80

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.invoice_gen.schemas" = ["*.xsd"]
"src.review_ui" = ["templates/*.html", "static/*.css", "static/*.js"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
