name: Rebase descriptive benchmark docstrings

on:
  push:
    branches:
      - docs/descriptive-benchmark-docstrings-v3

permissions:
  contents: write

jobs:
  rewrite-docstrings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out newest PR head
        uses: actions/checkout@v4
        with:
          ref: docs/descriptive-benchmark-docstrings-v3
          fetch-depth: 0

      - name: Copy reviewed function contracts onto the newest code
        shell: bash
        run: |
          git fetch origin \
            docs/descriptive-benchmark-docstrings-v2:refs/remotes/origin/docstrings-old

          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          import textwrap
          from pathlib import Path


          TARGETS = (
              "src/agentic_repair/benchmark_corpus.py",
              "src/agentic_repair/benchmark_publication.py",
              "src/agentic_repair/benchmark_runner.py",
              "src/agentic_repair/benchmark_scoring.py",
              "tests/agentic_repair/test_benchmark_corpus.py",
              "tests/agentic_repair/test_benchmark_runner.py",
              "tests/agentic_repair/test_benchmark_scoring.py",
              "tests/test_project_metadata.py",
          )


          class FunctionCollector(ast.NodeVisitor):
              def __init__(self) -> None:
                  self.scope: list[str] = []
                  self.functions: dict[
                      str,
                      ast.FunctionDef | ast.AsyncFunctionDef,
                  ] = {}

              def visit_ClassDef(self, node: ast.ClassDef) -> None:
                  self.scope.append(node.name)
                  self.generic_visit(node)
                  self.scope.pop()

              def visit_FunctionDef(self, node: ast.FunctionDef) -> None:
                  self._visit_function(node)

              def visit_AsyncFunctionDef(
                  self,
                  node: ast.AsyncFunctionDef,
              ) -> None:
                  self._visit_function(node)

              def _visit_function(
                  self,
                  node: ast.FunctionDef | ast.AsyncFunctionDef,
              ) -> None:
                  qualified_name = ".".join((*self.scope, node.name))
                  self.functions[qualified_name] = node
                  self.scope.append(node.name)
                  self.generic_visit(node)
                  self.scope.pop()


          def collect(source: str, filename: str) -> FunctionCollector:
              tree = ast.parse(source, filename=filename)
              collector = FunctionCollector()
              collector.visit(tree)
              return collector


          def render_docstring(text: str, indent: str) -> list[str]:
              width = max(44, 79 - len(indent))
              paragraphs = []
              for paragraph in text.strip().split("\n\n"):
                  normalized = " ".join(paragraph.split())
                  paragraphs.append(textwrap.fill(normalized, width=width))
              body_lines = "\n\n".join(paragraphs).splitlines()
              rendered = [f'{indent}"""{body_lines[0]}\n']
              for line in body_lines[1:]:
                  rendered.append(f"{indent}{line}\n" if line else "\n")
              rendered.append(f'{indent}"""\n')
              return rendered


          def rewrite(path: str) -> None:
              old_source = subprocess.check_output(
                  ["git", "show", f"origin/docstrings-old:{path}"],
                  text=True,
              )
              new_path = Path(path)
              new_source = new_path.read_text(encoding="utf-8")
              old_collector = collect(old_source, f"old:{path}")
              new_collector = collect(new_source, path)

              if set(old_collector.functions) != set(new_collector.functions):
                  raise AssertionError(
                      f"{path}: function set changed between stacked heads"
                  )

              docstrings: dict[str, str] = {}
              for name, node in old_collector.functions.items():
                  docstring = ast.get_docstring(node, clean=True)
                  if docstring is None or len(docstring) < 80:
                      raise AssertionError(
                          f"old:{path}:{name} lacks a descriptive docstring"
                      )
                  docstrings[name] = docstring

              if path == "tests/agentic_repair/test_benchmark_runner.py":
                  docstrings[
                      "test_run_benchmark_case_uses_real_graph_and_records_selection"
                  ] = (
                      "Verify that the real graph converts a valid model tool call into "
                      "one benchmark selection.\n\nScripts one repair command and asserts "
                      "the chosen path and index, successful attempt, production tool "
                      "binding, and the current one-model-call completion contract."
                  )

              lines = new_source.splitlines(keepends=True)
              edits: list[tuple[int, int, list[str]]] = []
              for name, node in new_collector.functions.items():
                  indent = " " * (node.col_offset + 4)
                  first_statement = node.body[0]
                  if (
                      isinstance(first_statement, ast.Expr)
                      and isinstance(first_statement.value, ast.Constant)
                      and isinstance(first_statement.value.value, str)
                  ):
                      start = first_statement.lineno - 1
                      end = first_statement.end_lineno
                  else:
                      start = first_statement.lineno - 1
                      end = start
                  edits.append(
                      (start, end, render_docstring(docstrings[name], indent))
                  )

              for start, end, replacement in sorted(edits, reverse=True):
                  lines[start:end] = replacement

              rewritten = "".join(lines)
              rewritten_collector = collect(rewritten, path)
              for name, node in rewritten_collector.functions.items():
                  docstring = ast.get_docstring(node, clean=True)
                  if docstring is None or len(docstring) < 80:
                      raise AssertionError(
                          f"{path}:{name} has insufficient docstring"
                      )
              new_path.write_text(rewritten, encoding="utf-8")


          for target in TARGETS:
              rewrite(target)
          PY

      - name: Verify documentation-only rewrite
        shell: bash
        run: |
          python -m compileall -q \
            src/agentic_repair/benchmark_corpus.py \
            src/agentic_repair/benchmark_publication.py \
            src/agentic_repair/benchmark_runner.py \
            src/agentic_repair/benchmark_scoring.py \
            tests/agentic_repair/test_benchmark_corpus.py \
            tests/agentic_repair/test_benchmark_runner.py \
            tests/agentic_repair/test_benchmark_scoring.py \
            tests/test_project_metadata.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/agentic_repair/benchmark_corpus.py \
            src/agentic_repair/benchmark_publication.py \
            src/agentic_repair/benchmark_runner.py \
            src/agentic_repair/benchmark_scoring.py \
            tests/agentic_repair/test_benchmark_corpus.py \
            tests/agentic_repair/test_benchmark_runner.py \
            tests/agentic_repair/test_benchmark_scoring.py \
            tests/test_project_metadata.py | sort)"
          test "$actual" = "$expected"

      - name: Commit the final stacked change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebase-descriptive-docstrings.yml
          git add \
            src/agentic_repair/benchmark_corpus.py \
            src/agentic_repair/benchmark_publication.py \
            src/agentic_repair/benchmark_runner.py \
            src/agentic_repair/benchmark_scoring.py \
            tests/agentic_repair/test_benchmark_corpus.py \
            tests/agentic_repair/test_benchmark_runner.py \
            tests/agentic_repair/test_benchmark_scoring.py \
            tests/test_project_metadata.py
          git diff --cached --check
          git commit \
            -m "docs: explain benchmark functions" \
            -m "Replace terse or missing function docstrings with behavior-first contracts covering inputs, transformations, outputs, and failure cases across the benchmark implementation and tests."
          git push origin HEAD:docs/descriptive-benchmark-docstrings-v3
          git push origin --delete docs/descriptive-benchmark-docstrings-v2 || true
