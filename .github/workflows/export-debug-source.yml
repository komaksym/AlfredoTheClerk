name: Export debug source

on:
  push:
    branches:
      - debug/export-pr9-source
  pull_request:
    branches:
      - feat/review-ui-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Package exact source tree
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            -czf /tmp/debug-source.tar.gz .

      - name: Package installed site-packages
        run: |
          tar -czf /tmp/pr9-site-packages.tar.gz \
            .venv/lib/python3.13/site-packages

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pr9-debug-source
          path: /tmp/debug-source.tar.gz
          if-no-files-found: error

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: pr9-debug-site-packages
          path: /tmp/pr9-site-packages.tar.gz
          if-no-files-found: error
