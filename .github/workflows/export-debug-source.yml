name: Export debug source

on:
  push:
    branches:
      - debug/export-pr9-source
  pull_request:
    branches:
      - feat/review-ui-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package exact source tree
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=debug-source.tar.gz \
            -czf debug-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pr9-debug-source
          path: debug-source.tar.gz
          if-no-files-found: error
