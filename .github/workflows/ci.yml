name: PR 9 implementation bootstrap

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.ref_name == 'feat/review-ui-redesign' ||
      github.head_ref == 'feat/review-ui-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
      KSEF_TEST_CONTEXT_NIP: ${{ secrets.KSEF_TEST_CONTEXT_NIP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/review-ui-redesign
          fetch-depth: 0

      - name: Apply approved implementation
        run: |
          cat .github/pr9-bootstrap/part*.patch > /tmp/pr9.patch
          git apply --check /tmp/pr9.patch
          git apply /tmp/pr9.patch
          cp .github/pr9-bootstrap/ci-final.yml .github/workflows/ci.yml
          rm -rf .github/pr9-bootstrap

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Refresh dependency lock
        run: uv lock

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): harden repair safety and CI"
          git push origin HEAD:feat/review-ui-redesign

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium for browser E2E
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright src tests

      - name: Test
        run: uv run pytest -q -m "not browser_e2e and not ksef_live"

      - name: Run browser E2E
        run: uv run pytest -q -m browser_e2e

      - name: Capture browser smoke evidence
        run: |
          mkdir -p browser-smoke
          PYTHONPATH=. uv run python tests/review_ui/browser_smoke_server.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8001/review >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=1536,960 \
            --screenshot=browser-smoke/human-fallback.png \
            http://127.0.0.1:8001/review

          google-chrome --headless --no-sandbox --disable-gpu \
            --force-dark-mode \
            --window-size=1536,960 \
            --screenshot=browser-smoke/human-fallback-dark-preference.png \
            http://127.0.0.1:8001/review

          uv run python - <<'PY'
          from pathlib import Path

          from PIL import Image

          expected = (251, 250, 248)
          sample = (225, 20)
          screenshots = (
              Path("browser-smoke/human-fallback.png"),
              Path("browser-smoke/human-fallback-dark-preference.png"),
          )
          for screenshot in screenshots:
              with Image.open(screenshot) as image:
                  actual = image.convert("RGB").getpixel(sample)
              assert actual == expected, (
                  f"{screenshot} workspace pixel {sample} was {actual}; "
                  f"expected {expected}"
              )
          PY

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "reviewer_id=CI browser smoke" \
            --data-urlencode "mode::buyer.nip=manual" \
            --data-urlencode "manual::buyer.nip=5423511615" \
            http://127.0.0.1:8001/review >/dev/null

          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=1536,960 \
            --screenshot=browser-smoke/ready-for-ksef.png \
            http://127.0.0.1:8001/result

          test -s browser-smoke/human-fallback.png
          test -s browser-smoke/human-fallback-dark-preference.png
          test -s browser-smoke/ready-for-ksef.png

      - name: Upload browser smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-review-browser-smoke
          path: browser-smoke/*.png
          if-no-files-found: error

      - name: Compile Python sources
        run: uv run python -m compileall src tests

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test installed package resources
        run: >-
          uv run python tests/smoke_installed_xsd_validation.py
          dist/alfredotheclerk-*.whl

      - name: Require KSeF TEST credentials
        run: |
          test -n "$KSEF_TEST_TOKEN" || {
            echo "::error::KSEF_TEST_TOKEN repository secret is not configured"
            exit 1
          }
          test -n "$KSEF_TEST_CONTEXT_NIP" || {
            echo "::error::KSEF_TEST_CONTEXT_NIP repository secret is not configured"
            exit 1
          }

      - name: Run live KSeF TEST proof
        run: uv run pytest -m ksef_live -q
