name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_ksef_live:
        description: "Run the real KSeF TEST submission proof"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Verify active-slice docstrings
        run: uv run pytest tests/ksef/test_docstrings.py -q

      - name: Capture browser smoke evidence
        run: |
          mkdir -p browser-smoke
          PYTHONPATH=. uv run python tests/review_ui/browser_smoke_server.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8001/review >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=1440,1000 \
            --screenshot=browser-smoke/human-fallback.png \
            http://127.0.0.1:8001/review

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "reviewer_id=CI browser smoke" \
            --data-urlencode "mode::seller.nip=manual" \
            --data-urlencode "manual::seller.nip=8637940261" \
            http://127.0.0.1:8001/review >/dev/null

          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=1440,1000 \
            --screenshot=browser-smoke/ready-for-ksef.png \
            http://127.0.0.1:8001/result

          test -s browser-smoke/human-fallback.png
          test -s browser-smoke/ready-for-ksef.png

      - name: Upload browser smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-review-browser-smoke
          path: browser-smoke/*.png
          if-no-files-found: error

      - name: Compile Python sources
        run: uv run python -m compileall src tests

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test installed package resources
        run: >-
          uv run python tests/smoke_installed_xsd_validation.py
          dist/alfredotheclerk-*.whl

  persist-agentic-corpus:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate corpus
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from src.agentic_repair.benchmark_corpus import (
              AGENTIC_REPAIR_CORPUS_PATH,
              build_benchmark_corpus,
              corpus_to_json,
          )

          path = Path(AGENTIC_REPAIR_CORPUS_PATH)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              corpus_to_json(build_benchmark_corpus()),
              encoding="utf-8",
          )
          PY

      - name: Commit generated artifact
        run: |
          if git diff --quiet -- data/benchmark_cases/agentic_repair_v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmark_cases/agentic_repair_v1.json
          git commit -m "chore(benchmark): persist generated corpus"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # Manual-only proof. Configure KSEF_TEST_TOKEN and KSEF_TEST_CONTEXT_NIP as
  # repository secrets, dispatch this workflow on the feature branch, and set
  # run_ksef_live=true. Push and pull-request events always skip this job.
  ksef-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ksef_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_KSEF_LIVE: "1"
      KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
      KSEF_TEST_CONTEXT_NIP: ${{ secrets.KSEF_TEST_CONTEXT_NIP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: uv sync --locked

      - name: Require KSeF TEST credentials
        run: |
          test -n "$KSEF_TEST_TOKEN" || {
            echo "::error::KSEF_TEST_TOKEN repository secret is not configured"
            exit 1
          }
          test -n "$KSEF_TEST_CONTEXT_NIP" || {
            echo "::error::KSEF_TEST_CONTEXT_NIP repository secret is not configured"
            exit 1
          }

      - name: Compile Python sources
        run: uv run python -m compileall src tests

      - name: Run live KSeF TEST proof
        run: uv run pytest -m ksef_live -q
