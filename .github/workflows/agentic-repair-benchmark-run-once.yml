name: Agentic repair benchmark one-time

on:
  push:
    branches:
      - eval/agentic-repair-20260803
    paths-ignore:
      - reports/**

permissions:
  contents: write

concurrency:
  group: agentic-repair-benchmark-one-time
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check DeepSeek API key
        id: secret
        run: |
          mkdir -p reports
          if test -n "$DEEPSEEK_API_KEY"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "status=missing_deepseek_api_key" > reports/agentic-repair-benchmark-status.txt
          fi

      - name: Run held-out benchmark
        id: benchmark
        if: steps.secret.outputs.available == 'true'
        run: |
          set +e
          uv run python -m src.agentic_repair.benchmark_runner \
            --runs 3 \
            --max-error-rate 0.05 \
            --json-out reports/agentic-repair-benchmark.json \
            --markdown-out reports/agentic-repair-benchmark.md
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "status=benchmark_exit_$exit_code" > reports/agentic-repair-benchmark-status.txt
          exit 0

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-repair-benchmark
          path: reports/agentic-repair-benchmark*
          if-no-files-found: error

      - name: Persist reports to execution branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agentic-repair-benchmark*
          git commit -m "chore(eval): store benchmark reports [skip ci]"
          git push
