name: Sync PR 13 with PR 11

on:
  push:
    branches:
      - docs/descriptive-benchmark-docstrings-v3

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stacked docstring branch
        uses: actions/checkout@v4
        with:
          ref: docs/descriptive-benchmark-docstrings-v3
          fetch-depth: 0

      - name: Merge current PR 11 branch without retaining this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/agentic-repair-benchmark
          git merge --no-commit --no-ff origin/feat/agentic-repair-benchmark
          git rm .github/workflows/sync-pr13-with-pr11.yml
          git diff --check
          git commit \
            -m "chore: sync docstrings with benchmark branch" \
            -m "Bring the stacked documentation branch onto the current PR 11 head so CI exercises the same production graph dependency as the parent PR."
          git push origin HEAD:docs/descriptive-benchmark-docstrings-v3
