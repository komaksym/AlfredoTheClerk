name: Lock preview

on:
  push:
    branches:
      - feat/human-review-ui

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/human-review-ui

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Regenerate lock
        run: uv lock

      - name: Commit lock when it changed
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lock for review UI"
          git push origin HEAD:feat/human-review-ui
