name: KSeF lock helper

on:
  push:
    branches:
      - codex/ksef-test-submission-proof
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ksef-test-submission-proof
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - name: Update lockfile
        run: uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git commit -m "build(ksef): refresh dependency lock" -m "Regenerate uv.lock after promoting httpx and cryptography to direct production dependencies for the KSeF TEST boundary."
          git push origin HEAD:codex/ksef-test-submission-proof
