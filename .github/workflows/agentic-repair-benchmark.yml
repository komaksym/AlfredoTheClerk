name: Agentic repair benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeated runs over all 30 held-out hard cases"
        required: true
        default: "3"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agentic-repair-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '3' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate inputs and secret
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::DEEPSEEK_API_KEY repository secret is not configured"
            exit 1
          }
          case "$BENCHMARK_RUNS" in
            ''|*[!0-9]*|0)
              echo "::error::runs must be a positive integer"
              exit 1
              ;;
          esac

      - name: Run held-out benchmark
        run: |
          uv run python -m src.agentic_repair.benchmark_runner \
            --runs "$BENCHMARK_RUNS" \
            --max-error-rate 0.05 \
            --json-out reports/agentic-repair-benchmark.json \
            --markdown-out reports/agentic-repair-benchmark.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: agentic-repair-benchmark
          path: reports/agentic-repair-benchmark.*
          if-no-files-found: error
