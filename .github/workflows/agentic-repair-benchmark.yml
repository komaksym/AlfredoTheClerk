name: Agentic repair benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeated runs over all 30 held-out hard cases"
        required: true
        default: "3"
        type: string
  push:
    branches:
      - eval/post-abstention-20260804
    paths:
      - ".github/workflows/agentic-repair-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '3' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish run metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          printf 'run_id=%s\ncommit=%s\nruns=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BENCHMARK_RUNS" \
            > reports/agentic-repair-run.txt
          git add reports/agentic-repair-run.txt
          git commit -m "chore(eval): record benchmark run"
          git push origin HEAD:eval/post-abstention-20260804

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate inputs and secret
        run: |
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::DEEPSEEK_API_KEY repository secret is not configured"
            exit 1
          }
          case "$BENCHMARK_RUNS" in
            ''|*[!0-9]*|0)
              echo "::error::runs must be a positive integer"
              exit 1
              ;;
          esac

      - name: Run held-out benchmark
        run: |
          uv run python -m src.agentic_repair.benchmark_runner \
            --runs "$BENCHMARK_RUNS" \
            --max-error-rate 0.05 \
            --json-out reports/agentic-repair-benchmark.json \
            --markdown-out reports/agentic-repair-benchmark.md

      - name: Publish reports to temporary branch
        run: |
          git add reports/agentic-repair-benchmark.json reports/agentic-repair-benchmark.md
          git commit -m "chore(eval): publish merged abstention benchmark"
          git push origin HEAD:eval/post-abstention-20260804

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: agentic-repair-benchmark
          path: reports/agentic-repair-benchmark.*
          if-no-files-found: error
